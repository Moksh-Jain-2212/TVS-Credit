services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      APP_DATABASE_PATH: /app/data/nadi_app.db
      CORS_ALLOW_ORIGINS: http://localhost:3000
      BOOTSTRAP_CREATE_ADMIN: "true"
    ports:
      - "8000:8000"
    volumes:
      - nadi_data:/app/data
      - nadi_models:/app/models

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  nadi_data:
  nadi_models:
